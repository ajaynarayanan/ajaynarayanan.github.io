- title: Projects
  type: time_table
  contents:
  - title: Correlation-Aware Contextual Bandits
    maindescription: Applications in LLM routing.
    description:
    - Formulated LLM routing as a contextual bandit with correlated arms and surrogate
      rewards; designed correlation-aware algorithms with regret guarantees robust
      to surrogate errors while improving regret when surrogates are informative.
    - Demonstrated up to approximately 15% higher utility across multiple LLM routing
      benchmarks versus strong online learning baselines and competitive state-of-the-art
      routing methods.
    linkitems:
    - link:
      linkname: Project
  - title: NaviSense
    maindescription: Multimodal AI workflow for real-world task guidance.
    description:
    - Engineered a real-time multimodal pipeline combining LiDAR depth, visual inputs,
      and LLM reasoning for grounded, step-by-step task guidance in open-world environments.
    - Deployed LLaMA 3.2 1B Instruct on-device via ExecuTorch with 4-bit quantization,
      balancing latency, memory, and response quality for mobile inference.
    linkitems:
